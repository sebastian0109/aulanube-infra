version: "3.8"

services:
  db-cursos:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASS:-root123}
      MARIADB_DATABASE: ms_cursos_db
    volumes:
      - db_cursos:/var/lib/mysql
    networks:
      - aulanube
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  ms-cursos:
    image: sebas2027/ms-cursos:1.0
    environment:
      DB_URL: jdbc:mariadb://db-cursos:3306/ms_cursos_db
      DB_USER: root
      DB_PASS: ${DB_PASS:-root123}
    ports:
      - "8082:8082"
    networks:
      - aulanube
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s

  db-productos:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root123}
      MYSQL_DATABASE: evaluacion2_db
    volumes:
      - db_productos:/var/lib/mysql
    networks:
      - aulanube
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  ms-productos:
    image: sebas2027/ms-productos:1.0
    environment:
      DB_URL: "jdbc:mysql://db-productos:3306/evaluacion2_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USER: root
      DB_PASS: ${DB_PASS:-root123}
    ports:
      - "8081:8081"
    networks:
      - aulanube
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 10s

volumes:
  db_cursos:
  db_productos:

networks:
  aulanube:
    driver: overlay